<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2a44">
  <meta name="description" content="盤を1台で交互に遊ぶ、壁立てレース">
  <title>wall-race — 2人で壁を立てて競うレース</title>

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="wall-race">
  <meta property="og:title" content="wall-race — 2人で壁を立てて競うレース">
  <meta property="og:description" content="盤を1台で交互に遊ぶ、壁立てレース">
  <meta property="og:url" content="https://t-of.github.io/wall-race/">
  <meta property="og:image" content="https://t-of.github.io/wall-race/icons/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">

  <!-- apple-mobile-web-app-status-bar-style は付けない（black-translucent だと iOS 26 で上部が隠れる） -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="wall-race">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

  <link rel="stylesheet" href="./webapp-kit/webapp-kit.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <header class="bar">
      <h1 class="bar__title">wall-race</h1>
      <div class="bar__actions">
        <button class="pill" data-wak="install" hidden>アプリにする</button>
        <button class="pill" data-wak="share">共有</button>
      </div>
    </header>

    <section class="stage" id="stage">
      <div class="modes" id="players">
        <button class="pill" data-cpus="0" aria-pressed="true">2 人で</button>
        <button class="pill" data-cpus="1">CPU と</button>
        <button class="pill" data-cpus="2">CPU 同士</button>
      </div>
      <div class="info" id="info"></div>
      <svg id="board" class="board" aria-label="盤"></svg>
      <div class="modes" id="modes">
        <button class="pill" data-mode="move">移動</button>
        <button class="pill" data-mode="h">壁: 横</button>
        <button class="pill" data-mode="v">壁: 縦</button>
      </div>
      <button class="pill" id="again" hidden>もう一回</button>
    </section>

    <footer class="credit">
      <a href="/">T.OF...</a> のアプリ ・ <a href="https://t-of.github.io/contact/">問い合わせ</a> ・ <span class="ver">v4</span>
    </footer>
  </main>

  <script src="./webapp-kit/webapp-kit.js"></script>
  <script src="./main.js"></script>
</body>
</html>
